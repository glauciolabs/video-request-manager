apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: video-request-manager-production
  namespace: argocd
spec:
  project: video-request-manager
  source:
    repoURL: https://github.com/glauciolabs/video-request-manager
    targetRevision: master
    path: app/production
  destination:
    server: https://kubernetes.default.svc
    namespace: video-request-manager-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

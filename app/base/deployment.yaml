apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: vrm-workload
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: frontend
          image: ghcr.io/glauciolabs/video-request-manager-frontend:v0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: TURNSTILE_ENABLED
              valueFrom:
                secretKeyRef:
                  name: vrm-secrets
                  key: TURNSTILE_ENABLED
                  optional: true
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: vrm-secrets
                  key: TURNSTILE_SITE_KEY
                  optional: true
            - name: NEXT_PUBLIC_TURNSTILE_ENABLED
              valueFrom:
                secretKeyRef:
                  name: vrm-secrets
                  key: NEXT_PUBLIC_TURNSTILE_ENABLED
                  optional: true
            - name: NEXT_PUBLIC_TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: vrm-secrets
                  key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: vrm-config
            - secretRef:
                name: vrm-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---

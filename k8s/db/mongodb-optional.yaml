# Optional MongoDB path if you decide not to use PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: video-request-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: video-request-manager
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017

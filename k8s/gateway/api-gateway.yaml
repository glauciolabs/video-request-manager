apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: video-request-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/glauciolabs/video-request-manager-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: vrm-config
            - secretRef:
                name: vrm-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: video-request-manager
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: video-request-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
        - name: report-service
          image: ghcr.io/glauciolabs/video-request-manager-report-service:latest
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
          envFrom:
            - configMapRef:
                name: vrm-config
            - secretRef:
                name: vrm-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: video-request-manager
spec:
  selector:
    app: report-service
  ports:
    - port: 3005
      targetPort: 3005

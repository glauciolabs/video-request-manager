apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vrm-ingress
  namespace: video-request-manager
  annotations:
    kubernetes.io/ingress.class: contour
    # If Contour rate-limit-service is enabled, add related annotations/policies here.
spec:
  rules:
    - host: vrm.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-frontend
                port:
                  number: 3006
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

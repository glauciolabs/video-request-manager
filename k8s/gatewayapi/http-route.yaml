apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vrm-route
  namespace: video-request-manager
spec:
  parentRefs:
    - name: vrm-gateway
  hostnames:
    - "vrm.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: admin-frontend
          port: 3006
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
